<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zahra Najafi</title>
<meta name="description" content="Zahra Najafi — creative director and systems strategist.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121212;
    --frame:#1a1a1a;
    --line:#2a2a2a;
    --ink:#f5f5f5;
    --muted:#8a8a8a;
    --red:#a3241c;
    --red-bright:#c92e22;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Space Grotesk', -apple-system, sans-serif;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:32px;
    padding-bottom:64px;
  }
  .gateway{
    max-width:1080px;
    width:100%;
    display:grid;
    grid-template-columns:0.85fr 1fr;
    gap:64px;
    align-items:center;
  }
  @media (max-width:760px){
    .gateway{grid-template-columns:1fr; gap:32px; text-align:center;}
  }

  .frame{
    position:relative;
    width:100%;
    aspect-ratio:3/4;
    background:var(--frame);
    border:1px solid var(--line);
    overflow:hidden;
  }
  .frame img{
    width:100%; height:100%; object-fit:cover;
    filter:grayscale(0.15) contrast(1.03);
    opacity:0;
    animation:fadeIn 1.4s ease 0.2s forwards;
  }
  @keyframes fadeIn{ to{opacity:1;} }
  .frame .frame-edge{
    position:absolute; inset:0; pointer-events:none;
    box-shadow:inset 0 0 0 1px rgba(245,245,245,0.06);
  }

  .eyebrow{
    font-size:11.5px; letter-spacing:0.22em; text-transform:uppercase;
    color:var(--muted); margin:0 0 14px;
  }
  h1{
    font-size:clamp(30px,4.4vw,46px);
    font-weight:700; letter-spacing:-0.02em; line-height:1.05;
    text-transform:uppercase; margin:0 0 8px;
  }
  .role{
    font-size:13px; color:var(--muted); font-weight:400;
    letter-spacing:0.06em; text-transform:uppercase; margin:0 0 34px;
  }
  .manifesto{
    font-family:'Fraunces', serif; font-style:italic; font-weight:500;
    font-size:17px; line-height:1.65; color:#d6d6d6;
    border-left:2px solid var(--red); padding-left:18px; margin:0 0 42px;
    max-width:46ch;
  }
  @media (max-width:760px){
    .manifesto{margin-left:auto; margin-right:auto; text-align:left;}
  }

  .portal-btn{
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
    width:100%; padding:18px 22px;
    background:var(--ink); color:var(--bg);
    text-decoration:none; border:1px solid var(--ink);
    font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:13px;
    letter-spacing:0.08em; text-transform:uppercase;
    transition:background .2s ease, color .2s ease, border-color .2s ease, letter-spacing .2s ease;
  }
  .portal-btn:hover{
    background:var(--red); border-color:var(--red); color:var(--ink);
    letter-spacing:0.11em;
  }
  .portal-btn .arrow{transition:transform .2s ease;}
  .portal-btn:hover .arrow{transform:translateX(4px);}

  footer{
    margin-top:36px; text-align:center;
    font-size:11px; letter-spacing:0.05em; color:#4a4a4a;
  }
</style>
</head>
<body>

  <main class="gateway">
    <div class="frame">
      <img src="flowers-assets/looks/02-caged.jpg" alt="A sculptural white garment from Flowers Are Blooming in Antarctica.">
      <div class="frame-edge"></div>
    </div>

    <div>
      <p class="eyebrow">portfolio</p>
      <h1>Zahra Najafi</h1>
      <p class="role">Creative Director &amp; Systems Strategist</p>

      <p class="manifesto">"Things are changing, where we can't see them, yet they affect how we live our lives — who we've become subconsciously, through unconscious consumption."</p>

      <a href="flowers-are-blooming-in-antarctica.html" class="portal-btn">
        Flowers Are Blooming in Antarctica <span class="arrow">→</span>
      </a>
    </div>
  </main>

  <footer>more portals, soon</footer>

</body>
</html>
